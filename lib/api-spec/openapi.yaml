openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead management operations
  - name: settings
    description: Site configuration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Submit a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error

  /leads/stats:
    get:
      operationId: getLeadStats
      tags: [leads]
      summary: Get lead summary statistics
      responses:
        "200":
          description: Lead stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadStats"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a single lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead status or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Lead updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /settings:
    get:
      operationId: getSiteSettings
      tags: [settings]
      summary: Get all site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    post:
      operationId: updateSiteSettings
      tags: [settings]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Validation error

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Lead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        source:
          type: string
          description: "Where the lead came from: brochure, site-visit, whatsapp, exit-popup"
        status:
          type: string
          description: "Lead status: new, contacted, qualified, lost"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - phone
        - source
        - status
        - createdAt
        - updatedAt

    CreateLeadBody:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        source:
          type: string
          description: "Where the lead came from: brochure, site-visit, whatsapp, exit-popup"
      required:
        - name
        - phone
        - source

    UpdateLeadBody:
      type: object
      properties:
        status:
          type: string
        notes:
          type: ["string", "null"]

    LeadStats:
      type: object
      properties:
        total:
          type: integer
        newToday:
          type: integer
        byStatus:
          type: object
          properties:
            new:
              type: integer
            contacted:
              type: integer
            qualified:
              type: integer
            lost:
              type: integer
          required:
            - new
            - contacted
            - qualified
            - lost
        bySource:
          type: object
          properties:
            brochure:
              type: integer
            site-visit:
              type: integer
            whatsapp:
              type: integer
            exit-popup:
              type: integer
          required:
            - brochure
            - site-visit
            - whatsapp
            - exit-popup
      required:
        - total
        - newToday
        - byStatus
        - bySource

    SiteSettings:
      type: object
      properties:
        whatsapp_phone:
          type: string
          description: "WhatsApp number with country code (e.g., 919217567788)"
        contact_email:
          type: string
          description: "Contact email address"
        current_availability:
          type: string
          description: "Current villa availability count (0-17)"
        discount_pricing:
          type: string
          description: "Discount amount for pricing section (in Lakhs)"
        discount_exit_intent:
          type: string
          description: "Discount text for exit intent popup"
        base_price:
          type: string
          description: "Base price in Crores (e.g., 1.50)"
        location_advantages:
          type: array
          items:
            type: string
          description: "List of location advantages"
        pdf_google_drive_link:
          type: string
          description: "Google Drive link to PDF brochure"
        # Hero Section
        hero_badge_text:
          type: string
          description: "Hero badge text (e.g., 'Limited Inventory • High ROI Potential')"
        hero_heading:
          type: string
          description: "Hero main heading"
        hero_subheading:
          type: string
          description: "Hero subheading/description"
        hero_cta_primary:
          type: string
          description: "Primary CTA button text"
        hero_cta_secondary:
          type: string
          description: "Secondary CTA button text"
        hero_image_url:
          type: string
          description: "Hero background image URL from Supabase"
        # Features Section
        features_heading:
          type: string
          description: "Features section heading"
        features_description:
          type: string
          description: "Features section description"
        features_list:
          type: array
          items:
            type: string
          description: "List of feature items"
        features_image_url:
          type: string
          description: "Features section image URL from Supabase"
        # Immersion Section
        immersion_heading:
          type: string
          description: "Immersion section heading"
        immersion_description:
          type: string
          description: "Immersion section description"
        immersion_advantages_heading:
          type: string
          description: "Location advantages box heading"
        immersion_quote:
          type: string
          description: "Quote text in location advantages"
        immersion_image_url:
          type: string
          description: "Immersion section image URL from Supabase"
        # Investment Section
        investment_heading:
          type: string
          description: "Investment section heading"
        investment_description:
          type: string
          description: "Investment section description"
        investment_features:
          type: array
          items:
            type: string
          description: "List of investment features"
        investment_cta:
          type: string
          description: "Investment section CTA text"
        investment_image_url:
          type: string
          description: "Investment section image URL from Supabase"
        # Pricing Section
        pricing_heading:
          type: string
          description: "Pricing section heading"
        pricing_subheading:
          type: string
          description: "Pricing section subheading"
        # Footer
        footer_tagline:
          type: string
          description: "Footer tagline text"
      required:
        - whatsapp_phone
        - contact_email
        - current_availability
        - discount_pricing
        - discount_exit_intent

    UpdateSiteSettingsBody:
      type: object
      properties:
        whatsapp_phone:
          type: string
          description: "WhatsApp number with country code"
        contact_email:
          type: string
          description: "Contact email address"
        current_availability:
          type: string
          description: "Current villa availability count"
        discount_pricing:
          type: string
          description: "Discount amount for pricing section"
        discount_exit_intent:
          type: string
          description: "Discount text for exit intent popup"
        base_price:
          type: string
          description: "Base price in Crores"
        location_advantages:
          type: array
          items:
            type: string
          description: "List of location advantages"
        pdf_google_drive_link:
          type: string
          description: "Google Drive link to PDF brochure"
        # Hero Section
        hero_badge_text:
          type: string
          description: "Hero badge text"
        hero_heading:
          type: string
          description: "Hero main heading"
        hero_subheading:
          type: string
          description: "Hero subheading/description"
        hero_cta_primary:
          type: string
          description: "Primary CTA button text"
        hero_cta_secondary:
          type: string
          description: "Secondary CTA button text"
        hero_image_url:
          type: string
          description: "Hero background image URL from Supabase"
        # Features Section
        features_heading:
          type: string
          description: "Features section heading"
        features_description:
          type: string
          description: "Features section description"
        features_list:
          type: array
          items:
            type: string
          description: "List of feature items"
        features_image_url:
          type: string
          description: "Features section image URL from Supabase"
        # Immersion Section
        immersion_heading:
          type: string
          description: "Immersion section heading"
        immersion_description:
          type: string
          description: "Immersion section description"
        immersion_advantages_heading:
          type: string
          description: "Location advantages box heading"
        immersion_quote:
          type: string
          description: "Quote text in location advantages"
        immersion_image_url:
          type: string
          description: "Immersion section image URL from Supabase"
        # Investment Section
        investment_heading:
          type: string
          description: "Investment section heading"
        investment_description:
          type: string
          description: "Investment section description"
        investment_features:
          type: array
          items:
            type: string
          description: "List of investment features"
        investment_cta:
          type: string
          description: "Investment section CTA text"
        investment_image_url:
          type: string
          description: "Investment section image URL from Supabase"
        # Pricing Section
        pricing_heading:
          type: string
          description: "Pricing section heading"
        pricing_subheading:
          type: string
          description: "Pricing section subheading"
        # Footer
        footer_tagline:
          type: string
          description: "Footer tagline text"
